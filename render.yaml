services:
  - type: web
    name: doc-translator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Khoá ký phiên đăng nhập — Render tự sinh và giữ cố định giữa các lần deploy.
      - key: AUTH_SECRET
        generateValue: true
      # (Tuỳ chọn) email được duyệt sẵn, ngăn cách bằng dấu phẩy. Dùng để giữ
      # danh sách duyệt khi máy chủ khởi động lại trên gói Free.
      - key: PREAPPROVED_EMAILS
        value: ""
      # (Tuỳ chọn) bật nút "Đăng nhập bằng Google" — dán Client ID web từ Google Cloud.
      - key: GOOGLE_CLIENT_ID
        value: ""
      # (Tuỳ chọn) gửi email báo admin khi có người xin quyền (Gmail + App password).
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: APP_URL
        value: "https://ht-document-reader.onrender.com"
