services:
  - type: web
    name: doc-translator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Khoá ký phiên đăng nhập — Render tự sinh và giữ cố định giữa các lần deploy.
      - key: AUTH_SECRET
        generateValue: true
      # (Tuỳ chọn) email được duyệt sẵn, ngăn cách bằng dấu phẩy. Dùng để giữ
      # danh sách duyệt khi máy chủ khởi động lại trên gói Free.
      - key: PREAPPROVED_EMAILS
        value: ""
      # (Tuỳ chọn) email bị CHẶN vĩnh viễn, ngăn cách bằng dấu phẩy. Dùng khi muốn
      # thu hồi quyền một người và giữ được sau mỗi lần máy chủ khởi động lại.
      - key: BLOCKED_EMAILS
        value: ""
      # (Tuỳ chọn) bật nút "Đăng nhập bằng Google" — dán Client ID web từ Google Cloud.
      - key: GOOGLE_CLIENT_ID
        value: ""
      # Gửi email báo admin khi có người xin quyền.
      # CÁCH TỐT NHẤT trên Render Free (Render chặn cổng SMTP): tạo tài khoản Brevo
      # miễn phí -> xác minh email người gửi -> lấy API key (v3) dán vào đây,
      # và đặt MAIL_FROM = đúng email người gửi đã xác minh.
      - key: BREVO_API_KEY
        value: ""
      - key: MAIL_FROM
        value: ""
      # (Cách khác) Resend API key thay cho Brevo.
      - key: RESEND_API_KEY
        value: ""
      # (Chỉ dùng khi nơi chạy KHÔNG chặn SMTP) Gmail + App password.
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: APP_URL
        value: "https://ht-document-reader.onrender.com"
